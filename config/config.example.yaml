# Hermes Agent 配置说明
#
# 本文件不是可直接使用的配置模板。
# Hermes Agent 的真实配置格式请参考官方文档：
# https://hermes.nousresearch.com/docs
#
# 以下记录我在实际部署中用到的关键配置项和思路，供参考。
# 具体字段名和结构以 Hermes 官方文档为准。

# ── 模型接入 ──────────────────────────────────────────────
# Hermes 支持任何 OpenAI 兼容 API 的模型。
# 配置方式是在 config.yaml 的 models 部分指定 provider、model、api_key 等。
#
# 示例（以 DeepSeek 为例）：
#   models:
#     main:
#       provider: deepseek
#       model: deepseek-v4-pro
#       api_key_env: DEEPSEEK_API_KEY
#
# MiMo 也通过 OpenAI 兼容接口接入，端点为 https://api.xiaomimimo.com/v1
# 详见 docs/mimo-integration.md

# ── 消息平台 Gateway ─────────────────────────────────────
# Hermes 内置了钉钉和微信的 gateway 支持。
# 钉钉推荐用 Stream 模式（不需要公网回调 URL）。
# 微信用 weixin gateway（基于 itchat-uos 协议）。
#
# 具体配置方式：hermes config set gateway.dingtalk.xxx 或编辑 config.yaml

# ── MCP 工具 ──────────────────────────────────────────────
# 以下 MCP 服务器在实际使用中效果不错：
#   - playwright: 浏览器自动化（截图、点击、填表）
#   - sequential-thinking: 分步推理
#   - sqlite: 结构化数据查询
#
# 配置方式见 Hermes 官方文档的 MCP 章节。

# ── 定时任务 ──────────────────────────────────────────────
# Hermes 内置 cron 功能，可通过 hermes cron 命令或 config.yaml 配置。
# 我主要用来做每日定时推送和系统健康检查。

# ── 环境变量 ──────────────────────────────────────────────
# 建议将 API Key 等敏感信息放在环境变量或 ~/.hermes/.env 文件中：
#   DEEPSEEK_API_KEY=sk-xxx
#   XIAOMI_API_KEY=xxx
#   DINGTALK_APP_KEY=xxx
#   DINGTALK_APP_SECRET=xxx
